[project]
name = "router-soporte"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sebas", email = "sebastiangonzita@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.21",
    "python-dotenv>=1.2.4",
]

[project.scripts]
router-soporte = "router_soporte:main"

[build-system]
